<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Barajas Barber Studio — sitio en mantenimiento. Agenda tu cita por WhatsApp." />
  <title>Barajas Barber Studio — En mantenimiento</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png" />
  <style>
    :root {
      --bg: #0f0f0f;
      --gold: #c9a24b;
      --text: #ece7dd;
      --muted: #9a938680;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1c1a17 0%, var(--bg) 70%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem 1.25rem;
    }
    .card { max-width: 480px; }
    .logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin-bottom: 1.75rem;
      filter: drop-shadow(0 4px 18px rgba(201,162,75,.25));
    }
    .brand {
      font-size: 1.9rem;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .gold { color: var(--gold); }
    .divider {
      width: 60px;
      height: 2px;
      background: var(--gold);
      margin: 1.4rem auto;
      opacity: .7;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
    }
    p {
      color: #cfc8bb;
      line-height: 1.6;
      font-size: 1.02rem;
      margin-bottom: 1.9rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    a.btn {
      display: inline-block;
      padding: 0.75rem 1.4rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform .15s ease, opacity .15s ease;
    }
    a.btn:hover { transform: translateY(-2px); opacity: .92; }
    .btn-wa { background: var(--gold); color: #1a1710; }
    .btn-ghost {
      border: 1px solid #5a534733;
      background: #ffffff0d;
      color: var(--text);
    }
    .foot {
      margin-top: 2.5rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/img/logo.png" alt="Barajas Barber Studio" class="logo" width="130" height="130" />
    <div class="brand">BARAJAS<span class="gold"> BARBER</span> STUDIO</div>
    <div class="divider"></div>
    <h1>💈 Estamos afinando detalles</h1>
    <p>
      Nuestro sitio está en mantenimiento por el momento.<br />
      ¡Pero seguimos atendiendo! Agenda tu cita directamente por WhatsApp.
    </p>
    <div class="actions">
      <a class="btn btn-wa"
         href="https://wa.me/523351501877?text=Hola%2C%20me%20gustar%C3%ADa%20agendar%20una%20cita%20en%20Barajas%20Barber%20Studio%20%F0%9F%92%88"
         target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">💬 Agendar por WhatsApp</a>
      <a class="btn btn-ghost"
         href="https://www.facebook.com/barajasbarberShop08/"
         target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">📘 Facebook</a>
      <a class="btn btn-ghost"
         href="https://www.instagram.com/barajasbarbershop2026"
         target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">📸 Instagram</a>
    </div>
    <p class="foot">© 2026 Barajas Barber Studio · Villa de Álvarez, Colima</p>
  </main>
</body>
</html>
